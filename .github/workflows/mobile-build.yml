name: Mobile build

# Builds the Capacitor apps in the cloud so iOS can be produced without local Mac
# hardware (the team works on Windows). Android produces an installable debug APK;
# iOS does an unsigned smoke build to prove it compiles. Signed release builds
# (AAB / IPA) need signing secrets added later — see the notes at the bottom.

on:
  push:
    # `mobile-app` is the APK-build branch — it does NOT auto-deploy the website
    # (deploy.yml only runs on main), so APKs can be built without a production release.
    branches: [main, mobile-app]
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Android
        run: |
          npm run build
          npx cap sync android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # `secrets` can't be used in an `if:` expression, so detect it here and expose an output.
      - name: Detect signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FB: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$FB" ]; then echo "firebase=true" >> "$GITHUB_OUTPUT"; else echo "firebase=false" >> "$GITHUB_OUTPUT"; fi

      # ── Signed release APK (when signing secrets are configured) ──────────────
      - name: Decode release keystore
        if: steps.signing.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/dap-release.keystore"

      - name: Assemble signed release APK
        if: steps.signing.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dap-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed release APK
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ── Publish the signed APK to a stable URL on Hostinger (https://caseview.dap-ip.com/app.apk) ──
      # Reuses the same SSH secrets as the website deploy. Share that one link with the field team;
      # every signed build replaces the file, so the link always serves the latest version.
      - name: Stage APK as app.apk
        if: steps.signing.outputs.present == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk ./app.apk

      - name: Publish APK to Hostinger
        if: steps.signing.outputs.present == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: app.apk
          target: ${{ secrets.HOSTINGER_TARGET }}

      # ── Distribute the signed APK to the field team via Firebase App Distribution ──
      # Runs only once the FIREBASE_APP_ID + FIREBASE_SERVICE_ACCOUNT secrets are added.
      - name: Distribute to Firebase App Distribution
        if: steps.signing.outputs.present == 'true' && steps.signing.outputs.firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: field-team
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "DAP Field Team — automated build from mobile-app"

      # ── Fallback: debug APK when no signing secrets are set yet ───────────────
      - name: Assemble debug APK
        if: steps.signing.outputs.present != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: steps.signing.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    # Non-blocking: the iOS smoke build must not fail the whole pipeline or the Android APK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Capacitor 8 needs Xcode 16+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync iOS
        run: |
          npm run build
          npx cap sync ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build iOS app (unsigned smoke build)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

# To produce distributable builds, add repository secrets and extend the jobs:
#   Android (Play): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#                   ANDROID_KEY_PASSWORD  → sign `bundleRelease` (.aab).
#   iOS (App Store): APPLE certificate (.p12) + provisioning profile as secrets, then
#                    `xcodebuild -exportArchive` with an ExportOptions.plist.
# Also add VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY as repo secrets (referenced above).
